<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaleCheck - Live Freshness Detector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent-fresh: #22c55e;
      --accent-stale: #ef4444;
      --accent-warn: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 700; color: var(--primary); }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.95rem;
      resize: vertical;
    }
    .actions { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
    button {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #334155; color: var(--text); }
    button.secondary:hover { background: #475569; }
    .status-bar {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }
    pre {
      background: #090d16;
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.85rem;
      max-height: 350px;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-fresh { background: rgba(34,197,94,0.2); color: var(--accent-fresh); }
    .badge-stale { background: rgba(239,68,68,0.2); color: var(--accent-stale); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>StaleCheck Dashboard</h1>
      <p class="subtitle">PS6 Stale-Answer Detector — LangGraph + FastAPI API</p>
      <div class="status-bar" id="statusBar">
        <span>System: Checking...</span>
      </div>
    </header>

    <div class="card">
      <label for="input-text" style="display:block; margin-bottom: 0.5rem; font-weight: 600;">LLM Answer / Prompt to Verify</label>
      <textarea id="input-text" placeholder="Enter text to analyze (3 to 6000 characters)...">OpenAI released GPT-4 in March 2023 at a price of $0.03 per 1k prompt tokens.</textarea>
      <div class="actions">
        <button id="btnCheck">Check Answer</button>
        <button id="btnStream" class="secondary">Stream Check (SSE)</button>
        <button id="btnAsk" class="secondary">Ask & Check</button>
        <button id="btnHealth" class="secondary">Health Check</button>
      </div>
    </div>

    <div class="card">
      <h3>Live Output</h3>
      <div id="streamEvents" style="margin: 0.75rem 0; font-size: 0.85rem; color: var(--text-muted);">Ready</div>
      <pre id="outputLog">Results will appear here...</pre>
    </div>
  </div>

  <script>
    const out = document.getElementById("outputLog");
    const streamEvents = document.getElementById("streamEvents");
    const statusBar = document.getElementById("statusBar");

    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        statusBar.innerHTML = `<span>Status: <strong>${data.status}</strong></span> | <span>Tavily: ${data.env.TAVILY_API_KEY ? "Configured" : "Missing"}</span> | <span>Bifrost: ${data.env.BIFROST_API_KEY ? "Configured" : "Missing"}</span>`;
      } catch (e) {
        statusBar.innerHTML = `<span style="color:var(--accent-stale)">Status: Disconnected</span>`;
      }
    }
    checkHealth();

    document.getElementById("btnCheck").onclick = async () => {
      const text = document.getElementById("input-text").value;
      streamEvents.textContent = "Running /api/check...";
      out.textContent = "Loading...";
      try {
        const res = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        streamEvents.textContent = `Completed with score: ${data.overall ?? 'N/A'}`;
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = "Error: " + e.message;
      }
    };

    document.getElementById("btnAsk").onclick = async () => {
      const text = document.getElementById("input-text").value;
      streamEvents.textContent = "Running /api/ask...";
      out.textContent = "Loading...";
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        streamEvents.textContent = `Completed with score: ${data.overall ?? 'N/A'}`;
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = "Error: " + e.message;
      }
    };

    document.getElementById("btnStream").onclick = async () => {
      const text = document.getElementById("input-text").value;
      streamEvents.textContent = "Opening SSE stream to /api/check/stream...";
      out.textContent = "";

      const response = await fetch("/api/check/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n\n");
        buffer = lines.pop();

        for (const block of lines) {
          const matchEvent = block.match(/event:\s*(\w+)/);
          const matchData = block.match(/data:\s*([\s\S]+)/);
          if (matchEvent && matchData) {
            const ev = matchEvent[1];
            const data = JSON.parse(matchData[1]);
            if (ev === "node") {
              streamEvents.textContent = `Node: ${data.node} (took ${data.ms}ms)`;
            } else if (ev === "done") {
              streamEvents.textContent = `Done! Overall Freshness: ${data.overall}`;
              out.textContent = JSON.stringify(data, null, 2);
            } else if (ev === "error") {
              streamEvents.textContent = `Error: ${data.message}`;
            }
          }
        }
      }
    };

    document.getElementById("btnHealth").onclick = checkHealth;
  </script>
</body>
</html>
